services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: sc_mail_ci
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d sc_mail_ci"]
      interval: 2s
      timeout: 2s
      retries: 30
