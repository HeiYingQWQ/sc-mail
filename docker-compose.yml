services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: .
    environment:
      APP_ROLE: backend
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Rome}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_TLS_MODE: ${IMAP_TLS_MODE:-implicit}
      IMAP_EMAIL: ${IMAP_EMAIL:-}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_SYNC_FOLDERS: ${IMAP_SYNC_FOLDERS:-INBOX}
      IMAP_SYNC_HISTORY_MONTHS: ${IMAP_SYNC_HISTORY_MONTHS:-12}
      IMAP_SYNC_PAGE_SIZE: ${IMAP_SYNC_PAGE_SIZE:-5}
      IMAP_POLL_INTERVAL_SECONDS: ${IMAP_POLL_INTERVAL_SECONDS:-60}
      PROJECT_ANALYSIS_POLL_INTERVAL_SECONDS: ${PROJECT_ANALYSIS_POLL_INTERVAL_SECONDS:-30}
      IMAP_API_TOKEN: ${IMAP_API_TOKEN:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_RETRY_COUNT: ${AI_RETRY_COUNT:-1}
      AI_CONTEXT_MAX_CHARS: ${AI_CONTEXT_MAX_CHARS:-18000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      NOTIFICATION_ALLOWED_CHANNELS: ${NOTIFICATION_ALLOWED_CHANNELS:-telegram}
      NOTIFICATION_ALLOWED_RECIPIENTS: ${NOTIFICATION_ALLOWED_RECIPIENTS:-}
      AGENT_EVENT_WEBHOOK_URL: ${AGENT_EVENT_WEBHOOK_URL:-}
      AGENT_CHAT_WEBHOOK_URL: ${AGENT_CHAT_WEBHOOK_URL:-}
      OPENCLAW_WHATSAPP_NOTIFY_URL: ${OPENCLAW_WHATSAPP_NOTIFY_URL:-}
      AGENT_WEBHOOK_TOKEN: ${AGENT_WEBHOOK_TOKEN:-}
      AI_MAIL_PUBLIC_API_URL: ${AI_MAIL_PUBLIC_API_URL:-http://localhost:3000/api/v1}
      DAILY_BRIEF_ENABLED: ${DAILY_BRIEF_ENABLED:-false}
      DAILY_BRIEF_TIME: ${DAILY_BRIEF_TIME:-09:00}
      DAILY_BRIEF_LANGUAGE: ${DAILY_BRIEF_LANGUAGE:-zh-CN}
      DAILY_BRIEF_STYLE: ${DAILY_BRIEF_STYLE:-concise}
      DAILY_BRIEF_WAITING_THRESHOLD_DAYS: ${DAILY_BRIEF_WAITING_THRESHOLD_DAYS:-7}
      DAILY_BRIEF_FOLLOW_UP_WINDOW_DAYS: ${DAILY_BRIEF_FOLLOW_UP_WINDOW_DAYS:-7}
      DAILY_BRIEF_NOTIFY_WHEN_EMPTY: ${DAILY_BRIEF_NOTIFY_WHEN_EMPTY:-false}
      MAIL_RECONCILIATION_ENABLED: ${MAIL_RECONCILIATION_ENABLED:-true}
      MAIL_RECONCILIATION_TIME: ${MAIL_RECONCILIATION_TIME:-05:00}
      MAIL_DELETION_SYNC_ENABLED: ${MAIL_DELETION_SYNC_ENABLED:-true}
      MAIL_DELETION_SYNC_INTERVAL_HOURS: ${MAIL_DELETION_SYNC_INTERVAL_HOURS:-4}
      DASHBOARD_INITIAL_EMAIL: ${DASHBOARD_INITIAL_EMAIL:-}
      DASHBOARD_INITIAL_PASSWORD: ${DASHBOARD_INITIAL_PASSWORD:-}
      DASHBOARD_SECURE_COOKIE: ${DASHBOARD_SECURE_COOKIE:-false}
    command: ["sh", "-c", "pnpm db:migrate:deploy && node dist/main.js"]
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build: .
    environment:
      APP_ROLE: worker
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Rome}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_EMAIL: ${IMAP_EMAIL:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      IMAP_POLL_INTERVAL_SECONDS: ${IMAP_POLL_INTERVAL_SECONDS:-60}
      PROJECT_ANALYSIS_POLL_INTERVAL_SECONDS: ${PROJECT_ANALYSIS_POLL_INTERVAL_SECONDS:-30}
      IMAP_SYNC_FOLDERS: ${IMAP_SYNC_FOLDERS:-INBOX}
      IMAP_SYNC_HISTORY_MONTHS: ${IMAP_SYNC_HISTORY_MONTHS:-12}
      IMAP_SYNC_PAGE_SIZE: ${IMAP_SYNC_PAGE_SIZE:-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      NOTIFICATION_ALLOWED_CHANNELS: ${NOTIFICATION_ALLOWED_CHANNELS:-telegram}
      NOTIFICATION_ALLOWED_RECIPIENTS: ${NOTIFICATION_ALLOWED_RECIPIENTS:-}
      AGENT_EVENT_WEBHOOK_URL: ${AGENT_EVENT_WEBHOOK_URL:-}
      AGENT_CHAT_WEBHOOK_URL: ${AGENT_CHAT_WEBHOOK_URL:-}
      OPENCLAW_WHATSAPP_NOTIFY_URL: ${OPENCLAW_WHATSAPP_NOTIFY_URL:-}
      AGENT_WEBHOOK_TOKEN: ${AGENT_WEBHOOK_TOKEN:-}
      AI_MAIL_PUBLIC_API_URL: ${AI_MAIL_PUBLIC_API_URL:-http://localhost:3000/api/v1}
      DAILY_BRIEF_ENABLED: ${DAILY_BRIEF_ENABLED:-false}
      DAILY_BRIEF_TIME: ${DAILY_BRIEF_TIME:-09:00}
      DAILY_BRIEF_LANGUAGE: ${DAILY_BRIEF_LANGUAGE:-zh-CN}
      DAILY_BRIEF_STYLE: ${DAILY_BRIEF_STYLE:-concise}
      DAILY_BRIEF_WAITING_THRESHOLD_DAYS: ${DAILY_BRIEF_WAITING_THRESHOLD_DAYS:-7}
      DAILY_BRIEF_FOLLOW_UP_WINDOW_DAYS: ${DAILY_BRIEF_FOLLOW_UP_WINDOW_DAYS:-7}
      DAILY_BRIEF_NOTIFY_WHEN_EMPTY: ${DAILY_BRIEF_NOTIFY_WHEN_EMPTY:-false}
      MAIL_RECONCILIATION_ENABLED: ${MAIL_RECONCILIATION_ENABLED:-true}
      MAIL_RECONCILIATION_TIME: ${MAIL_RECONCILIATION_TIME:-05:00}
      MAIL_DELETION_SYNC_ENABLED: ${MAIL_DELETION_SYNC_ENABLED:-true}
      MAIL_DELETION_SYNC_INTERVAL_HOURS: ${MAIL_DELETION_SYNC_INTERVAL_HOURS:-4}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_RETRY_COUNT: ${AI_RETRY_COUNT:-1}
      AI_CONTEXT_MAX_CHARS: ${AI_CONTEXT_MAX_CHARS:-18000}
    command: ["node", "dist/main.js"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
